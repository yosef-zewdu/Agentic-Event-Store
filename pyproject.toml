[project]
name = "agentic-event-store"
version = "0.1.0"
description = "The Ledger — Agentic Event Store & Enterprise Audit Infrastructure"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0,<0.30",
    "pydantic>=2.6.0,<3.0",
    "fastmcp>=0.9.0",
    "python-dotenv>=1.0.0,<2.0",
    "reportlab>=4.4.10",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<0.25",
    "hypothesis>=6.100.0",
]
datagen = [
    "faker>=24.0.0,<26.0",
    "reportlab>=4.2.0,<5.0",
    "openpyxl>=3.1.0,<4.0",
    "openai>=1.30.0,<2.0",
    "langgraph>=0.1.0,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<0.25",
    "hypothesis>=6.100.0",
    "faker>=25.9.2",
]
