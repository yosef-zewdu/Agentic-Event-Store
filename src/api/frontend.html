<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Ledger — Application Viewer</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3e;
    --accent: #6c63ff;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  header span { color: var(--muted); font-size: 12px; }
  .search-bar { display: flex; gap: 8px; padding: 20px 24px; }
  .search-bar input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; transition: border-color .2s; }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar button { background: var(--accent); border: none; border-radius: var(--radius); padding: 10px 20px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
  .search-bar button:hover { opacity: .85; }
  .container { padding: 0 24px 40px; max-width: 1200px; }
  .error-box { background: #2d1515; border: 1px solid var(--red); border-radius: var(--radius); padding: 12px 16px; color: var(--red); margin-bottom: 16px; }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }

  /* Summary card */
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .summary-card .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: block; margin-bottom: 4px; }
  .summary-card .field .val { font-size: 15px; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-green { background: #14532d; color: var(--green); }
  .badge-red { background: #450a0a; color: var(--red); }
  .badge-yellow { background: #451a03; color: var(--yellow); }
  .badge-blue { background: #1e3a5f; color: var(--blue); }
  .badge-gray { background: #1e293b; color: var(--muted); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; transition: all .2s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Timeline */
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .tl-item { position: relative; margin-bottom: 16px; }
  .tl-dot { position: absolute; left: -24px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
  .tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .tl-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .tl-type { font-weight: 700; font-size: 13px; }
  .tl-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .tl-pos { font-size: 11px; color: var(--muted); }
  .tl-payload { margin-top: 8px; }
  .tl-payload details summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  .tl-payload pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-size: 11px; overflow-x: auto; margin-top: 6px; color: #a5b4fc; }

  /* Compliance table */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }

  /* Agent sessions */
  .agent-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .agent-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .agent-header:hover { background: rgba(255,255,255,.03); }
  .agent-events { padding: 0 16px 12px; }
  .agent-event-row { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .agent-event-row:last-child { border-bottom: none; }
  .agent-event-type { font-weight: 600; min-width: 200px; }
  .agent-event-time { color: var(--muted); }

  /* Agent stream tabs */
  .agent-stream-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
  .agent-stream-tab { padding: 6px 12px; cursor: pointer; border: 1px solid var(--border); border-radius: 20px; color: var(--muted); font-size: 12px; font-weight: 500; transition: all .2s; }
  .agent-stream-tab:hover { color: var(--text); border-color: var(--accent); }
  .agent-stream-tab.active { color: var(--accent); border-color: var(--accent); background: rgba(108,99,255,.1); }
  .agent-stream-panel { display: none; }
  .agent-stream-panel.active { display: block; }

  /* All-events stream badge */
  .stream-label { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; background: #1e293b; color: var(--muted); margin-right: 6px; font-family: monospace; }
  .stream-loan { background: #1e3a5f; color: var(--blue); }
  .stream-credit { background: #14532d; color: var(--green); }
  .stream-fraud { background: #450a0a; color: var(--red); }
  .stream-compliance { background: #451a03; color: var(--yellow); }
  .stream-agent { background: #2d1b69; color: #a5b4fc; }
  .stream-docpkg { background: #1a2744; color: #93c5fd; }

  /* Token usage */
  .token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .token-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .token-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 4px; }
  .token-card .value { font-size: 24px; font-weight: 700; }
  .token-table td:nth-child(2), .token-table td:nth-child(3), .token-table td:nth-child(4), .token-table td:nth-child(5) { text-align: right; font-variant-numeric: tabular-nums; }
  .fallback-warn { color: var(--yellow); font-size: 11px; }
  .error-detail { font-size: 11px; color: var(--red); font-family: monospace; margin-top: 4px; }

  /* Integrity */
  .integrity-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .integrity-box .hash { font-family: monospace; font-size: 12px; word-break: break-all; color: #a5b4fc; margin-top: 8px; }

  /* Health */
  .health-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .health-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .health-card .proj-name { font-weight: 700; margin-bottom: 8px; }
  .health-card .lag { font-size: 22px; font-weight: 700; }
  .lag-ok { color: var(--green); }
  .lag-warn { color: var(--yellow); }
  .lag-bad { color: var(--red); }
</style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#6c63ff"/><path d="M7 9h14M7 14h10M7 19h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
  <h1>The Ledger</h1>
  <span>Application Viewer</span>
</header>

<div class="search-bar">
  <input id="appInput" type="text" placeholder="Enter application ID (e.g. app-001)" value="" />
  <button onclick="loadApplication()">Load</button>
  <button onclick="showOccDemo()" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 20px;color:var(--yellow);font-size:14px;font-weight:600;cursor:pointer;margin-left:8px">⚡ OCC Demo</button>
  <button onclick="showUpcastingDemo()" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 20px;color:#a5b4fc;font-size:14px;font-weight:600;cursor:pointer;margin-left:8px">🔬 Upcasting</button>
  <button onclick="showGasTownDemo()" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 20px;color:#22c55e;font-size:14px;font-weight:600;cursor:pointer;margin-left:8px">💥 Gas Town</button>
  <button onclick="showWhatIfDemo()" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 20px;color:#f59e0b;font-size:14px;font-weight:600;cursor:pointer;margin-left:8px">🔀 What-If</button>
</div>

<div id="occ-demo-panel" style="display:none;padding:20px 24px 40px"></div>
<div id="upcasting-demo-panel" style="display:none;padding:20px 24px 40px"></div>
<div id="gas-town-demo-panel" style="display:none;padding:20px 24px 40px"></div>
<div id="what-if-demo-panel" style="display:none;padding:20px 24px 40px"></div>

<div class="container" id="main"></div>

<script>
const BASE = '';

function stateBadge(state) {
  if (!state) return '<span class="badge badge-gray">—</span>';
  const s = state.toLowerCase();
  if (s.includes('approved') || s.includes('final')) return `<span class="badge badge-green">${state}</span>`;
  if (s.includes('declined')) return `<span class="badge badge-red">${state}</span>`;
  if (s.includes('pending') || s.includes('awaiting')) return `<span class="badge badge-yellow">${state}</span>`;
  return `<span class="badge badge-blue">${state}</span>`;
}

function verdictBadge(v) {
  if (!v) return '<span class="badge badge-gray">—</span>';
  const u = v.toUpperCase();
  if (u === 'PASSED' || u === 'CLEAR') return `<span class="badge badge-green">${v}</span>`;
  if (u === 'FAILED' || u === 'BLOCKED') return `<span class="badge badge-red">${v}</span>`;
  if (u === 'NOTED') return `<span class="badge badge-yellow">${v}</span>`;
  return `<span class="badge badge-blue">${v}</span>`;
}

function fmtDt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString();
}

function fmtAmount(n) {
  if (n == null) return '—';
  return '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function eventDotColor(type) {
  if (type.includes('Approved') || type.includes('Passed') || type.includes('Completed')) return '#22c55e';
  if (type.includes('Declined') || type.includes('Failed') || type.includes('Withdrawn')) return '#ef4444';
  if (type.includes('Requested') || type.includes('Started')) return '#6c63ff';
  if (type.includes('Generated') || type.includes('Review')) return '#f59e0b';
  return '#3b82f6';
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) {
    const err = await r.json().catch(() => ({detail: r.statusText}));
    throw new Error(err.detail || r.statusText);
  }
  return r.json();
}

let _appId = '';

async function loadApplication() {
  const appId = document.getElementById('appInput').value.trim();
  if (!appId) return;
  _appId = appId;
  // Hide OCC panel if open
  document.getElementById('occ-demo-panel').style.display = 'none';
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">Loading…</div>';

  try {
    const [summary, events] = await Promise.all([
      fetchJSON(`${BASE}/applications/${appId}`),
      fetchJSON(`${BASE}/applications/${appId}/events`),
    ]);
    renderPage(appId, summary, events);
  } catch (e) {
    main.innerHTML = `<div class="error-box">Error: ${e.message}</div>`;
  }
}

function renderPage(appId, summary, events) {
  const main = document.getElementById('main');
  main.innerHTML = `
    ${renderSummary(summary)}
    <div class="tabs">
      <div class="tab active" onclick="switchTab('events')">Loan Stream (${events.length})</div>
      <div class="tab" onclick="switchTab('agent-streams')">Agent Streams</div>
      <div class="tab" onclick="switchTab('all-events')">All Events</div>
      <div class="tab" onclick="switchTab('compliance')">Compliance</div>
      <div class="tab" onclick="switchTab('agents')">Agent Sessions</div>
      <div class="tab" onclick="switchTab('token-usage')">Token Usage</div>
      <div class="tab" onclick="switchTab('integrity')">Integrity</div>
      <div class="tab" onclick="switchTab('audit-trail')">Audit Trail</div>
      <div class="tab" onclick="switchTab('health')">Ledger Health</div>
    </div>
    <div id="tab-events" class="tab-panel active">${renderTimeline(events)}</div>
    <div id="tab-agent-streams" class="tab-panel"><div class="loading" id="agent-streams-loading">Loading agent streams…</div></div>
    <div id="tab-all-events" class="tab-panel"><div class="loading" id="all-events-loading">Loading all events…</div></div>
    <div id="tab-compliance" class="tab-panel"><div class="loading" id="compliance-loading">Loading compliance…</div></div>
    <div id="tab-agents" class="tab-panel"><div class="loading" id="agents-loading">Loading agent sessions…</div></div>
    <div id="tab-token-usage" class="tab-panel"><div class="loading" id="token-usage-loading">Loading token usage…</div></div>
    <div id="tab-integrity" class="tab-panel"><div class="loading" id="integrity-loading">Loading integrity…</div></div>
    <div id="tab-audit-trail" class="tab-panel"><div class="loading" id="audit-trail-loading">Loading audit trail…</div></div>
    <div id="tab-health" class="tab-panel"><div class="loading" id="health-loading">Loading health…</div></div>
  `;

  // Eagerly load all panels
  loadCompliance(appId);
  loadAgents(appId);
  loadAgentStreams(appId);
  loadAllEvents(appId);
  loadTokenUsage(appId);
  loadIntegrity(appId);
  loadAuditTrail(appId);
  loadHealth();
}

function switchTab(name) {
  const names = ['events','agent-streams','all-events','compliance','agents','token-usage','integrity','audit-trail','health'];
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === `tab-${name}`);
  });
}

function renderSummary(s) {
  const decision = s.decision || '—';
  const decBadge = decision === 'APPROVE' ? 'badge-green' : decision === 'DECLINE' ? 'badge-red' : decision === 'REFER' ? 'badge-yellow' : 'badge-gray';
  return `
  <div class="summary-card">
    <div class="field"><label>Application ID</label><div class="val">${s.application_id}</div></div>
    <div class="field"><label>State</label><div class="val">${stateBadge(s.state)}</div></div>
    <div class="field"><label>Applicant</label><div class="val">${s.applicant_id || '—'}</div></div>
    <div class="field"><label>Requested Amount</label><div class="val">${fmtAmount(s.requested_amount_usd)}</div></div>
    <div class="field"><label>Approved Amount</label><div class="val">${fmtAmount(s.approved_amount_usd)}</div></div>
    <div class="field"><label>Risk Tier</label><div class="val">${s.risk_tier ? `<span class="badge badge-blue">${s.risk_tier}</span>` : '—'}</div></div>
    <div class="field"><label>Fraud Score</label><div class="val">${s.fraud_score != null ? Number(s.fraud_score).toFixed(3) : '—'}</div></div>
    <div class="field"><label>Compliance</label><div class="val">${verdictBadge(s.compliance_status)}</div></div>
    <div class="field"><label>Decision</label><div class="val"><span class="badge ${decBadge}">${decision}</span></div></div>
    <div class="field"><label>Human Reviewer</label><div class="val">${s.human_reviewer_id || '—'}</div></div>
    <div class="field"><label>Last Event</label><div class="val" style="font-size:12px">${s.last_event_type || '—'}</div></div>
    <div class="field"><label>Last Event At</label><div class="val" style="font-size:12px">${fmtDt(s.last_event_at)}</div></div>
    <div class="field"><label>Final Decision At</label><div class="val" style="font-size:12px">${fmtDt(s.final_decision_at)}</div></div>
  </div>`;
}

function renderTimeline(events) {
  if (!events.length) return '<p style="color:var(--muted)">No events found.</p>';
  return `<div class="timeline">${events.map(e => `
    <div class="tl-item">
      <div class="tl-dot" style="background:${eventDotColor(e.event_type)}"></div>
      <div class="tl-card">
        <div class="tl-header">
          <span class="tl-type">${e.event_type}</span>
          <span class="tl-time">${fmtDt(e.recorded_at)}</span>
        </div>
        <div class="tl-pos" style="margin-top:2px">pos ${e.stream_position} · global ${e.global_position} · v${e.event_version}</div>
        <div class="tl-payload">
          <details>
            <summary>Payload</summary>
            <pre>${JSON.stringify(e.payload, null, 2)}</pre>
          </details>
        </div>
      </div>
    </div>`).join('')}</div>`;
}

function streamClass(streamId) {
  if (streamId.startsWith('loan-')) return 'stream-loan';
  if (streamId.startsWith('credit-')) return 'stream-credit';
  if (streamId.startsWith('fraud-')) return 'stream-fraud';
  if (streamId.startsWith('compliance-')) return 'stream-compliance';
  if (streamId.startsWith('agent-')) return 'stream-agent';
  if (streamId.startsWith('docpkg-')) return 'stream-docpkg';
  return '';
}

async function loadAgentStreams(appId) {
  try {
    const sessions = await fetchJSON(`${BASE}/applications/${appId}/agents`);
    if (!sessions.length) {
      document.getElementById('tab-agent-streams').innerHTML = '<p style="color:var(--muted)">No agent streams found.</p>';
      return;
    }
    // Build sub-tabs: one per agent stream
    const tabBar = sessions.map((s, i) =>
      `<div class="agent-stream-tab ${i === 0 ? 'active' : ''}" onclick="switchAgentStream(${i})">${s.agent_type || s.session_id}</div>`
    ).join('');
    const panels = sessions.map((s, i) => `
      <div class="agent-stream-panel ${i === 0 ? 'active' : ''}" id="agent-stream-panel-${i}">
        <div style="margin-bottom:12px;color:var(--muted);font-size:12px">
          Stream: <code style="color:#a5b4fc">${s.session_id}</code> &nbsp;·&nbsp;
          Agent: <strong>${s.agent_id || '—'}</strong> &nbsp;·&nbsp;
          Model: ${s.model_version || '—'} &nbsp;·&nbsp;
          ${s.event_count} events
        </div>
        <div class="timeline">${s.events.map(e => `
          <div class="tl-item">
            <div class="tl-dot" style="background:${eventDotColor(e.event_type)}"></div>
            <div class="tl-card">
              <div class="tl-header">
                <span class="tl-type">${e.event_type}</span>
                <span class="tl-time">${fmtDt(e.recorded_at)}</span>
              </div>
              <div class="tl-payload">
                <details>
                  <summary>Payload</summary>
                  <pre>${JSON.stringify(e.payload, null, 2)}</pre>
                </details>
              </div>
            </div>
          </div>`).join('')}
        </div>
      </div>`).join('');
    document.getElementById('tab-agent-streams').innerHTML =
      `<div class="agent-stream-tabs">${tabBar}</div>${panels}`;
  } catch (e) {
    document.getElementById('tab-agent-streams').innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

function switchAgentStream(idx) {
  document.querySelectorAll('.agent-stream-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.agent-stream-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}

async function loadAllEvents(appId) {
  try {
    const events = await fetchJSON(`${BASE}/applications/${appId}/all-events`);
    if (!events.length) {
      document.getElementById('tab-all-events').innerHTML = '<p style="color:var(--muted)">No events found.</p>';
      return;
    }
    // Group count by stream
    const counts = {};
    events.forEach(e => { counts[e.stream_id] = (counts[e.stream_id] || 0) + 1; });
    const summary = Object.entries(counts)
      .map(([s, c]) => `<span class="stream-label ${streamClass(s)}">${s} (${c})</span>`)
      .join(' ');
    const timeline = `<div class="timeline">${events.map(e => `
      <div class="tl-item">
        <div class="tl-dot" style="background:${eventDotColor(e.event_type)}"></div>
        <div class="tl-card">
          <div class="tl-header">
            <span class="tl-type">
              <span class="stream-label ${streamClass(e.stream_id)}">${e.stream_id}</span>${e.event_type}
            </span>
            <span class="tl-time">${fmtDt(e.recorded_at)}</span>
          </div>
          <div class="tl-pos">global ${e.global_position} · stream pos ${e.stream_position} · v${e.event_version}</div>
          <div class="tl-payload">
            <details>
              <summary>Payload</summary>
              <pre>${JSON.stringify(e.payload, null, 2)}</pre>
            </details>
          </div>
        </div>
      </div>`).join('')}</div>`;
    document.getElementById('tab-all-events').innerHTML =
      `<div style="margin-bottom:16px;line-height:2">${summary}</div>${timeline}`;
  } catch (e) {
    document.getElementById('tab-all-events').innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

async function loadTokenUsage(appId) {
  try {
    const [data, pricing] = await Promise.all([
      fetchJSON(`${BASE}/applications/${appId}/token-usage`),
      fetchJSON(`${BASE}/ledger/pricing`).catch(() => null),
    ]);
    document.getElementById('tab-token-usage').innerHTML = renderTokenUsage(data, pricing);
  } catch (e) {
    document.getElementById('tab-token-usage').innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

function renderTokenUsage(data, pricing) {
  const t = data.totals;
  const anyFallbacks = t.total_fallbacks > 0;
  const totalsHtml = `
    <div class="token-grid">
      <div class="token-card">
        <div class="label">Total Tokens</div>
        <div class="value">${t.total_tokens_used.toLocaleString()}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          ↑ ${(t.total_tokens_input||0).toLocaleString()} in &nbsp;·&nbsp; ↓ ${(t.total_tokens_output||0).toLocaleString()} out
        </div>
      </div>
      <div class="token-card">
        <div class="label">LLM Calls</div>
        <div class="value">${t.total_llm_calls}</div>
      </div>
      <div class="token-card">
        <div class="label">Total Cost</div>
        <div class="value">$${t.total_cost_usd.toFixed(6)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          $${((t.total_tokens_input||0) * 1.0 / 1_000_000).toFixed(6)} input &nbsp;+&nbsp;
          $${((t.total_tokens_output||0) * 12.0 / 1_000_000).toFixed(6)} output
        </div>
      </div>
      <div class="token-card">
        <div class="label">LLM Fallbacks</div>
        <div class="value ${anyFallbacks ? 'lag-warn' : 'lag-ok'}">${t.total_fallbacks}</div>
        ${anyFallbacks ? '<div class="fallback-warn">⚠ LLM failed, used defaults</div>' : ''}
      </div>
    </div>
    <div style="margin-bottom:16px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px">
      ${pricing ? `
        Active: <span style="color:var(--accent)">${pricing.active_provider}</span> /
        <span style="color:var(--text)">${pricing.active_model}</span>
        &nbsp;·&nbsp;
        ${(() => {
          const p = pricing.pricing[pricing.active_model];
          return p
            ? `$${p.input}/M input · $${p.output}/M output`
            : '<span style="color:var(--muted)">pricing unknown</span>';
        })()}
      ` : 'Pricing: google/gemini-3.1-pro-preview — $1.00/M input · $12.00/M output &nbsp;|&nbsp; arcee-ai/trinity-large-preview:free — $0.00'}
    </div>`;

  if (!data.agents.length) return totalsHtml + '<p style="color:var(--muted)">No agent sessions found.</p>';

  const rows = data.agents.map(a => {
    const errHtml = a.llm_errors.length
      ? a.llm_errors.map(e => `<div class="error-detail">↳ ${e}</div>`).join('')
      : '';
    const tokIn = a.total_tokens_input || 0;
    const tokOut = a.total_tokens_output || 0;
    return `<tr>
      <td>
        <strong>${a.agent_type || '—'}</strong>
        <div style="font-size:11px;color:var(--muted);font-family:monospace">${a.session_id || ''}</div>
        ${errHtml}
      </td>
      <td>
        ${a.total_tokens_used.toLocaleString()}
        <div style="font-size:10px;color:var(--muted)">↑${tokIn.toLocaleString()} ↓${tokOut.toLocaleString()}</div>
      </td>
      <td>${a.total_llm_calls}</td>
      <td>$${a.total_cost_usd.toFixed(6)}</td>
      <td>${(a.total_duration_ms / 1000).toFixed(1)}s</td>
      <td>${a.llm_fallback_count > 0 ? `<span class="badge badge-yellow">${a.llm_fallback_count} fallback${a.llm_fallback_count > 1 ? 's' : ''}</span>` : '<span class="badge badge-green">OK</span>'}</td>
    </tr>`;
  }).join('');

  return totalsHtml + `
    <table class="token-table">
      <thead><tr>
        <th>Agent</th><th>Tokens (in/out)</th><th>LLM Calls</th><th>Cost</th><th>Duration</th><th>Status</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function loadCompliance(appId, asOf) {
  const resultsEl = document.getElementById('compliance-results');
  if (resultsEl) {
    resultsEl.innerHTML = '<div class="loading">Loading…</div>';
  } else {
    // First load — render the full tab with controls + empty results container
    document.getElementById('tab-compliance').innerHTML =
      renderComplianceControls(appId) +
      '<div id="compliance-results"><div class="loading">Loading…</div></div>';
  }
  try {
    const url = asOf
      ? `${BASE}/applications/${appId}/compliance?as_of=${encodeURIComponent(asOf)}`
      : `${BASE}/applications/${appId}/compliance`;
    const data = await fetchJSON(url);
    const rows = Array.isArray(data) ? data : (data.records || []);
    const asOfLabel = data.as_of
      ? `<div style="margin-bottom:12px;font-size:12px;color:var(--yellow)">⏱ Point-in-time view as of ${fmtDt(data.as_of)} — ${rows.length} record(s)</div>`
      : '';
    const hint = rows.length
      ? `<div style="font-size:11px;color:var(--muted);margin-bottom:12px">
           Events span: ${fmtDt(rows[0].recorded_at)} → ${fmtDt(rows[rows.length-1].recorded_at)}
         </div>`
      : '';
    document.getElementById('compliance-results').innerHTML =
      hint + asOfLabel + renderComplianceTable(rows);
  } catch (e) {
    document.getElementById('compliance-results').innerHTML =
      `<div class="error-box">${e.message}</div>`;
  }
}

function renderComplianceControls(appId) {
  return `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
      <input id="asOfInput" type="datetime-local" step="1"
        style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
               padding:8px 12px;color:var(--text);font-size:13px;outline:none" />
      <button onclick="(() => {
          const v = document.getElementById('asOfInput').value;
          if (!v) return;
          // Convert local datetime-local value to UTC ISO string for the API
          const localDate = new Date(v);
          const utcIso = localDate.toISOString();
          loadCompliance('${appId}', utcIso);
        })()"
        style="background:var(--accent);border:none;border-radius:var(--radius);padding:8px 16px;
               color:#fff;font-size:13px;font-weight:600;cursor:pointer">
        Query as of…
      </button>
      <button onclick="loadCompliance('${appId}')"
        style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
               padding:8px 16px;color:var(--text);font-size:13px;cursor:pointer">
        Current State
      </button>
    </div>`;
}

function renderComplianceTable(rows) {
  if (!rows.length) return '<p style="color:var(--muted)">No compliance records.</p>';
  return `<table>
    <thead><tr>

      <td>${verdictBadge(r.verdict)}</td>

async function loadAuditTrail(appId, fromPos, toPos) {
  const params = new URLSearchParams();
  if (fromPos != null && fromPos !== '') params.set('from_pos', fromPos);
  if (toPos != null && toPos !== '') params.set('to_pos', toPos);
  const qs = params.toString() ? '?' + params.toString() : '';
  try {
    const data = await fetchJSON(`${BASE}/applications/${appId}/audit-trail${qs}`);
    const events = data.events || [];
    const rangeLabel = (fromPos != null && fromPos !== '') || (toPos != null && toPos !== '')
      ? `<span style="color:var(--yellow);font-size:12px">⏱ Showing positions ${fromPos || 0}–${toPos ?? 'end'}</span>`
      : '';
    document.getElementById('tab-audit-trail').innerHTML = `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
        <input id="auditFromPos" type="number" min="0" placeholder="From position"
          value="${fromPos ?? ''}"
          style="width:140px;background:var(--surface);border:1px solid var(--border);
                 border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;outline:none" />
        <input id="auditToPos" type="number" min="0" placeholder="To position"
          value="${toPos ?? ''}"
          style="width:140px;background:var(--surface);border:1px solid var(--border);
                 border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;outline:none" />
        <button onclick="loadAuditTrail('${appId}', document.getElementById('auditFromPos').value || null, document.getElementById('auditToPos').value || null)"
          style="background:var(--accent);border:none;border-radius:var(--radius);padding:8px 16px;
                 color:#fff;font-size:13px;font-weight:600;cursor:pointer">
          Filter
        </button>
        <button onclick="loadAuditTrail('${appId}')"
          style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
                 padding:8px 16px;color:var(--text);font-size:13px;cursor:pointer">
          All
        </button>
        <span style="color:var(--muted);font-size:12px;margin-left:4px">${data.event_count} event${data.event_count !== 1 ? 's' : ''} · stream: <code style="color:#a5b4fc">${data.stream_id}</code></span>
        ${rangeLabel}
      </div>
      ${events.length === 0
        ? '<p style="color:var(--muted)">No audit trail events found.</p>'
        : `<div class="timeline">${events.map(e => `
            <div class="tl-item">
              <div class="tl-dot" style="background:${eventDotColor(e.event_type)}"></div>
              <div class="tl-card">
                <div class="tl-header">
                  <span class="tl-type">${e.event_type}</span>
                  <span class="tl-time">${fmtDt(e.recorded_at)}</span>

                <div class="tl-pos">pos ${e.stream_position}</div>

                    <summary>Payload</summary>

      }`;
  } catch (e) {
    document.getElementById('tab-audit-trail').innerHTML = `<div class="error-box">${e.message}</div>`;
  }

async function runOccDemo() {
  document.getElementById('occRunBtn').disabled = true;
  document.getElementById('occRunBtn').textContent = 'Running…';
  document.getElementById('occ-result').innerHTML = '<div class="loading">Firing two agents simultaneously…</div>';
  try {
    const r = await fetch('/demo/occ-collision', { method: 'POST' });
    const d = await r.json();
    const winnerColor = '#22c55e';
    const loserColor  = '#ef4444';
    const retryColor  = '#6c63ff';

    const agentRow = (label, data) => {
      if (!data) return '';
      const isWin = data.status === 'success';
      const color = isWin ? winnerColor : loserColor;
      const icon  = isWin ? '✓ WON' : '✗ OCC ERROR';
      return `
        <div style="background:var(--bg);border:1px solid ${color}33;border-radius:var(--radius);padding:12px 16px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:700;font-size:15px">Agent ${label}</span>
            <span style="color:${color};font-weight:700;font-size:13px">${icon}</span>
          </div>
          ${isWin
            ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">Appended at version ${data.appended_at_version}</div>`
            : `<div style="font-size:12px;color:var(--muted);margin-top:4px">
                expected_version=${data.expected_version} · actual_version=${data.actual_version}<br>
                suggested_action: <code style="color:#a5b4fc">${data.suggested_action}</code>
               </div>`
          }
        </div>`;
    };

    const retryHtml = d.retry ? `
      <div style="background:var(--bg);border:1px solid ${retryColor}33;border-radius:var(--radius);padding:12px 16px;margin-top:8px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:700">Agent ${d.retry.agent} — RETRY</span>
          <span style="color:${retryColor};font-weight:700;font-size:13px">↺ SUCCEEDED</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">
          Reloaded stream version, retried at version ${d.retry.retried_at_version}
        </div>
      </div>` : '';

    document.getElementById('occ-result').innerHTML = `
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px;font-family:monospace">
        Stream: ${d.stream} &nbsp;·&nbsp; initial_version=${d.initial_version} &nbsp;·&nbsp; final_version=${d.final_version}
      </div>
      ${agentRow('A', d.agent_A)}
      ${agentRow('B', d.agent_B)}
      ${retryHtml}
      <div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:var(--radius);font-size:12px;color:var(--muted)">
        <strong style="color:var(--text)">Result:</strong>
        Exactly <strong style="color:${winnerColor}">1 event appended</strong> (version ${d.initial_version} → ${d.initial_version + 1}).
        Agent ${d.loser} received <code style="color:#ef4444">OptimisticConcurrencyError</code>,
        reloaded the stream, and retried successfully at version ${d.retry?.retried_at_version ?? '—'}.
      </div>`;
  } catch(e) {
    document.getElementById('occ-result').innerHTML = `<div class="error-box">${e.message}</div>`;
  } finally {
    document.getElementById('occRunBtn').disabled = false;
    document.getElementById('occRunBtn').textContent = '▶ Run Collision';
  }
}

async function runUpcastingDemo(appId) {
  if (!appId) return;
  document.getElementById('upcasting-result').innerHTML = '<div class="loading">Loading event…</div>';
  try {
    const d = await fetchJSON(`${BASE}/demo/upcasting/${appId}`);

    const fieldRow = (key, rawVal, upcastedVal, isAdded) => {
      const added = isAdded
        ? `<span style="background:#1a2744;color:#a5b4fc;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px">ADDED BY UPCASTER</span>`
        : '';
      const valStr = v => v === null ? '<span style="color:var(--muted)">null</span>'
                        : v === undefined ? '<span style="color:var(--muted)">—</span>'
                        : `<code style="color:#a5b4fc">${JSON.stringify(v)}</code>`;
      return `<tr>
        <td style="padding:6px 10px;font-family:monospace;font-size:12px">${key}${added}</td>
        <td style="padding:6px 10px;font-size:12px">${isAdded ? '<span style="color:var(--muted)">not present</span>' : valStr(rawVal)}</td>
        <td style="padding:6px 10px;font-size:12px">${valStr(upcastedVal)}</td>
      </tr>`;
    };

    const addedKeys = Object.keys(d.added_by_upcasting);
    const sharedKeys = Object.keys(d.raw_payload);

    const rows = [
      ...sharedKeys.map(k => fieldRow(k, d.raw_payload[k], d.upcasted_payload[k], false)),
      ...addedKeys.map(k => fieldRow(k, undefined, d.added_by_upcasting[k], true)),
    ].join('');

    document.getElementById('upcasting-result').innerHTML = `
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:12px">
          <div style="color:var(--muted);margin-bottom:2px">Event ID</div>
          <code style="color:#a5b4fc;font-size:11px">${d.event_id}</code>
        </div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:12px">
          <div style="color:var(--muted);margin-bottom:2px">Stored version</div>
          <strong style="color:var(--red)">v${d.raw_version}</strong>
        </div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:12px">
          <div style="color:var(--muted);margin-bottom:2px">Loaded version</div>
          <strong style="color:var(--green)">v${d.upcasted_version}</strong>
        </div>
        <div style="background:var(--bg);border:1px solid #22c55e33;border-radius:var(--radius);padding:10px 16px;font-size:12px">
          <div style="color:var(--muted);margin-bottom:2px">DB row unchanged</div>
          <strong style="color:var(--green)">✓ IMMUTABLE</strong>
        </div>
        <div style="background:var(--bg);border:1px solid #a5b4fc33;border-radius:var(--radius);padding:10px 16px;font-size:12px">
          <div style="color:var(--muted);margin-bottom:2px">Fields added at read time</div>
          <strong style="color:#a5b4fc">${addedKeys.length} field${addedKeys.length !== 1 ? 's' : ''}</strong>
        </div>
      </div>
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:6px 10px;font-size:11px;color:var(--muted);text-transform:uppercase">Field</th>
            <th style="text-align:left;padding:6px 10px;font-size:11px;color:var(--red);text-transform:uppercase">Raw DB (v${d.raw_version})</th>
            <th style="text-align:left;padding:6px 10px;font-size:11px;color:var(--green);text-transform:uppercase">Loaded (v${d.upcasted_version})</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch(e) {
    document.getElementById('upcasting-result').innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

async function runGasTownDemo() {
  document.getElementById('gasTownRunBtn').disabled = true;
  document.getElementById('gasTownRunBtn').textContent = 'Running…';
  document.getElementById('gas-town-result').innerHTML = '<div class="loading">Simulating crash and reconstructing context…</div>';
  try {
    const d = await fetch('/demo/gas-town-recovery', { method: 'POST' }).then(r => r.json());
    const r = d.reconstruction;
    const healthColor = r.session_health_status === 'NEEDS_RECONCILIATION' ? '#f59e0b' : '#22c55e';
    const healthIcon  = r.session_health_status === 'NEEDS_RECONCILIATION' ? '⚠' : '✓';

    const pendingHtml = r.pending_work.length ? r.pending_work.map(pw => `
      <div style="background:var(--bg);border:1px solid #f59e0b33;border-radius:4px;padding:8px 12px;margin-top:6px;font-size:12px">
        <span style="color:#f59e0b">⚠ Partial Decision</span>
        &nbsp;·&nbsp; <code>${pw.request_event_type}</code> at pos ${pw.stream_position}
        &nbsp;→&nbsp; <code style="color:var(--muted)">${pw.completion_event_type}</code> (missing)
      </div>`).join('') : '<div style="color:var(--green);font-size:12px;margin-top:6px">No partial decisions</div>';

    document.getElementById('gas-town-result').innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px">
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Session</div>
          <code style="font-size:11px;color:#a5b4fc">${d.session_id}</code>
        </div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Events Written</div>
          <strong>${d.events_written}</strong>
        </div>
        <div style="background:var(--bg);border:1px solid var(--red)33;border-radius:var(--radius);padding:12px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Crash At</div>
          <strong style="color:var(--red)">${d.crash_at_node}</strong>
        </div>
        <div style="background:var(--bg);border:1px solid ${healthColor}33;border-radius:var(--radius);padding:12px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Health Status</div>
          <strong style="color:${healthColor}">${healthIcon} ${r.session_health_status}</strong>
        </div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Last Position</div>
          <strong>${r.last_event_position}</strong>
        </div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Verbatim / Summarised</div>
          <strong>${r.verbatim_event_count}</strong> <span style="color:var(--muted)">/ ${r.summarised_event_count}</span>
        </div>
      </div>

      <div style="margin-bottom:12px">
        <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Pending Work (unmatched request/completion pairs)</div>
        ${pendingHtml}
      </div>

      <div>
        <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Reconstructed Context (preview)</div>
        <pre style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:11px;color:#a5b4fc;overflow-x:auto;white-space:pre-wrap">${d.reconstruction.context_text_preview}</pre>
      </div>`;
  } catch(e) {
    document.getElementById('gas-town-result').innerHTML = `<div class="error-box">${e.message}</div>`;
  } finally {
    document.getElementById('gasTownRunBtn').disabled = false;
    document.getElementById('gasTownRunBtn').textContent = '▶ Simulate Crash & Recover';
  }
}

async function runWhatIfDemo(appId) {
  if (!appId) return;
  document.getElementById('what-if-result').innerHTML = '<div class="loading">Running counterfactual analysis…</div>';
  try {
    const d = await fetchJSON(`${BASE}/demo/what-if/${appId}`);
    const r = d.real;
    const cf = d.counterfactual;

    const stateChanged = r.final_state !== cf.final_state;
    const recChanged   = r.recommendation !== cf.recommendation;
    const limitDiff    = cf.recommended_limit_usd - r.recommended_limit_usd;

    const compareRow = (label, realVal, cfVal, fmt) => {
      const changed = realVal !== cfVal;
      const cfStyle = changed ? 'color:var(--red);font-weight:700' : 'color:var(--muted)';
      return `<tr>
        <td style="padding:8px 12px;font-size:13px;color:var(--muted)">${label}</td>
        <td style="padding:8px 12px;font-size:13px;color:var(--green)">${fmt ? fmt(realVal) : realVal}</td>
        <td style="padding:8px 12px;font-size:13px;${cfStyle}">${fmt ? fmt(cfVal) : cfVal}${changed ? ' ←' : ''}</td>
      </tr>`;
    };

    const fmtMoney = v => v != null ? '$' + Number(v).toLocaleString(undefined, {maximumFractionDigits:0}) : '—';

    const rulesHtml = d.business_rules_triggered.map(rule => `
      <div style="background:var(--bg);border:1px solid #f59e0b33;border-radius:4px;padding:10px 14px;margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <code style="color:#f59e0b;font-size:12px">${rule.rule}</code>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">${rule.description}</div>
        <div style="font-size:12px;color:var(--text);margin-top:2px">→ ${rule.effect}</div>
      </div>`).join('');

    document.getElementById('what-if-result').innerHTML = `
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:12px">
          <div style="color:var(--muted);margin-bottom:2px">Branch Point</div>
          <code style="color:#a5b4fc">CreditAnalysisCompleted</code>
          <div style="color:var(--muted);font-size:11px;margin-top:2px">${d.pre_branch_events} events before</div>
        </div>
        <div style="background:var(--bg);border:1px solid #22c55e33;border-radius:var(--radius);padding:10px 14px;font-size:12px">
          <div style="color:var(--muted);margin-bottom:2px">DB Written</div>
          <strong style="color:var(--green)">✓ NEVER — in-memory only</strong>
        </div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:12px">
          <div style="color:var(--muted);margin-bottom:2px">Divergence Events</div>
          <strong>${d.divergence_event_count}</strong>
        </div>
      </div>

      <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--muted);text-transform:uppercase">Field</th>
            <th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--green);text-transform:uppercase">Real</th>
            <th style="text-align:left;padding:8px 12px;font-size:11px;color:var(--red);text-transform:uppercase">Counterfactual (HIGH)</th>
          </tr>
        </thead>
        <tbody>
          ${compareRow('risk_tier', r.risk_tier, cf.risk_tier)}
          ${compareRow('recommended_limit_usd', r.recommended_limit_usd, cf.recommended_limit_usd, fmtMoney)}
          ${compareRow('confidence', r.confidence, cf.confidence, v => Number(v).toFixed(2))}
          ${compareRow('final_state', r.final_state, cf.final_state)}
          ${compareRow('recommendation', r.recommendation || '—', cf.recommendation || '—')}
        </tbody>
      </table>

      <div style="margin-bottom:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">
        Business Rules Triggered
      </div>
      ${rulesHtml}`;
  } catch(e) {
    document.getElementById('what-if-result').innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

async function loadHealth() {
  try {
    const h = await fetchJSON(`${BASE}/ledger/health`);
    const cards = h.projections.map(p => {
      const lag = p.lag_events;
      const cls = lag === 0 ? 'lag-ok' : lag < 10 ? 'lag-warn' : 'lag-bad';
      return `<div class="health-card">
        <div class="proj-name">${p.name}</div>
        <div class="lag ${cls}">${lag} events behind</div>
        <div style="color:var(--muted);font-size:12px;margin-top:4px">checkpoint: ${p.last_position ?? '—'}</div>
        <div style="color:var(--muted);font-size:12px">updated: ${fmtDt(p.updated_at)}</div>
      </div>`;
    }).join('');
    document.getElementById('tab-health').innerHTML = `
      <div style="margin-bottom:12px;color:var(--muted);font-size:13px">Latest global position: <strong style="color:var(--text)">${h.latest_global_position ?? '—'}</strong></div>
      <div class="health-grid">${cards || '<p style="color:var(--muted)">No projections found.</p>'}</div>`;
  } catch (e) {
    document.getElementById('tab-health').innerHTML = `<div class="error-box">${e.message}</div>`;
  }
}

// Allow pressing Enter in the input
document.getElementById('appInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadApplication();
});
